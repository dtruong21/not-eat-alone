name: CI

# Quality gate for the gitflow model. Runs on every PR into a long-lived or
# release/hotfix branch, and on the post-merge commit of develop/main before
# deploy. Pins Flutter to the .fvmrc version. Generated files
# (*.freezed.dart / *.g.dart) are git-ignored, so every job runs build_runner.

on:
  pull_request:
    branches:
      - main
      - develop
      - 'release/**'
      - 'hotfix/**'
  push:
    branches:
      - main
      - develop

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.4'

jobs:
  analyze-test:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Code generation
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Test
        run: flutter test

  build-android:
    name: Build Android (stage, unsigned)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Code generation
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Build stage APK (debug, compile-verify)
        run: flutter build apk --flavor stage -t lib/main_stage.dart --debug

  build-ios:
    name: Build iOS (stage, no codesign)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Code generation
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Build stage iOS (debug, no codesign, compile-verify)
        run: flutter build ios --flavor stage -t lib/main_stage.dart --debug --no-codesign
