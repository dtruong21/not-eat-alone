name: CI

# Quality gate for the gitflow model. Runs on every PR into a long-lived or
# release/hotfix branch, and on the post-merge commit of develop/main before
# deploy.
#
# Speed/cost levers (see docs/CICD.md):
#   - `changes` classifies the diff so docs-only PRs skip every heavy job and
#     backend-only PRs skip the Flutter/macOS jobs. Pushes to develop/main always
#     run everything.
#   - One composite action (.github/actions/setup-flutter) replaces four copies
#     of the setup steps; the Flutter version comes from .fvmrc only.
#   - pub / Gradle / CocoaPods / npm / emulator caches.
#   - Superseded PR runs are cancelled; draft PRs skip the macOS jobs.
#   - `CI OK` is a single stable check that is green when every job that had to
#     run passed (skipped jobs are fine), so branch protection can require just it.
#
# Generated files (*.freezed.dart / *.g.dart) are git-ignored, so every Flutter
# job runs build_runner (inside the composite action).

on:
  pull_request:
    branches:
      - main
      - develop
      - 'release/**'
      - 'hotfix/**'
  push:
    branches:
      - main
      - develop

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded PR runs, but never cut a post-merge develop/main run short.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Classify the diff. Anything outside the lists below (docs, markdown, assets
  # nobody builds) runs no heavy job. Workflow/action changes run everything.
  # ---------------------------------------------------------------------------
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      app: ${{ steps.filter.outputs.app }}
      functions: ${{ steps.filter.outputs.functions }}
      rules: ${{ steps.filter.outputs.rules }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify changed files
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "pull_request" ]; then
            echo "push event: run everything"
            printf 'app=true\nfunctions=true\nrules=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only "origin/$BASE_REF...HEAD")
          echo "Changed files:"; echo "$files" | sed 's/^/  /'
          match() { echo "$files" | grep -Eq "$1" && echo true || echo false; }
          ci='^\.github/'
          app=$(match "$ci|^(lib|test|integration_test|ios|android|assets|scripts)/|^(pubspec\.(yaml|lock)|analysis_options\.yaml|\.fvmrc|Makefile|firebase\.json|\.env\.example)$")
          functions=$(match "$ci|^firebase/functions/")
          rules=$(match "$ci|^firebase/(firestore\.rules|firestore\.indexes\.json|storage\.rules|rules-test/)|^firebase\.json$")
          printf 'app=%s\nfunctions=%s\nrules=%s\n' "$app" "$functions" "$rules" | tee -a "$GITHUB_OUTPUT"

  analyze-test:
    name: Analyze & test
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-flutter
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Test
        run: flutter test --reporter github
      # The runner is UTC, so the local-time display tests would otherwise pass
      # vacuously (UTC fields == local fields). Re-run them in a +14h zone,
      # where the local day differs from the UTC day for a 23:30Z input.
      - name: Test (non-UTC timezone, local-time display)
        run: >-
          TZ=Pacific/Kiritimati flutter test --reporter github
          test/core/util/date_format_test.dart
          test/features/chat/presentation/widgets/
          test/features/matching/presentation/widgets/request_inbox_tile_test.dart

  build-android:
    name: Build Android (stage, unsigned)
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: ./.github/actions/setup-flutter
      - name: Build stage APK (debug, compile-verify)
        run: flutter build apk --flavor stage -t lib/main_stage.dart --debug

  build-ios:
    name: Build iOS (stage, no codesign)
    needs: changes
    # macOS minutes are the scarce ones: skip drafts, and PRs with no app change.
    if: needs.changes.outputs.app == 'true' && github.event.pull_request.draft != true
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Select stage GoogleService-Info.plist
        # iOS has no build phase that copies the per-flavor plist into Runner/
        # (unlike Android's gradle sourceSets), and the default-path plist is
        # git-ignored scratch. Place the committed stage config where the Xcode
        # project expects it. See docs/CICD.md (iOS flavor plist).
        run: cp ios/config/stage/GoogleService-Info.plist ios/Runner/GoogleService-Info.plist
      - uses: ./.github/actions/setup-flutter
      - name: Restore CocoaPods
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: pods-${{ runner.os }}-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: pods-${{ runner.os }}-
      - name: Build stage iOS (debug, no codesign, compile-verify)
        run: flutter build ios --flavor stage -t lib/main_stage.dart --debug --no-codesign

  functions-build:
    name: Functions build & test
    needs: changes
    if: needs.changes.outputs.functions == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: firebase/functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: firebase/functions/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm test

  # Firestore security rules against the local emulator (firebase/rules-test).
  rules-test:
    name: Firestore rules tests
    needs: changes
    if: needs.changes.outputs.rules == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: firebase/rules-test/package-lock.json
      # firebase-tools' emulators need Java 21+.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Restore Firestore emulator jar
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ hashFiles('firebase/rules-test/package-lock.json') }}
      - name: Install
        working-directory: firebase/rules-test
        run: npm ci
      - name: Run rules tests
        working-directory: firebase/rules-test
        run: npm test

  # End-to-end suite (integration_test/) against the Firebase Emulator Suite on
  # a real iOS Simulator. NON-BLOCKING for now: deliberately NOT a required
  # check in branch protection (see docs/CICD.md for the promotion criteria).
  #
  # Why macOS + a simulator: the headless `flutter-tester` has no Firebase
  # native plugins (MissingPluginException), so these tests need a real
  # device/simulator. The run itself goes through `make e2e` (ios-plist,
  # ios-sim-boot, ios-privacy, emulators:exec, location-prompt watchdog) so CI
  # and local dev exercise the exact same path.
  e2e:
    name: E2E (emulator, iOS sim)
    # Only after the cheap gate is green (don't burn up to 100 macOS minutes on
    # a PR that already fails analyze/test), and only when something it covers
    # changed.
    needs: [changes, analyze-test]
    if: >-
      needs.analyze-test.result == 'success' &&
      github.event.pull_request.draft != true
    runs-on: macos-latest
    permissions:
      contents: read
    # Setup ~10 min + 2 attempts x 40 min (see the retry step) with headroom.
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # firebase-tools' emulators need Java 21+; the runner image's default is 17.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: ./.github/actions/setup-flutter
      - name: Provide `fvm` shim (Flutter comes from the setup-flutter action)
        # The Makefile invokes `fvm flutter ...`. Installing real FVM would
        # download a second copy of the same SDK, so shim it onto the
        # flutter-action SDK instead. (The version is read from .fvmrc by the
        # setup action, so there is no second pin to drift.)
        run: |
          mkdir -p "$RUNNER_TEMP/shim"
          printf '%s\n' '#!/bin/sh' \
            'case "$1" in flutter|dart) cmd=$1; shift; exec "$cmd" "$@" ;; esac' \
            'echo "fvm shim: unsupported invocation: $*" >&2; exit 2' \
            > "$RUNNER_TEMP/shim/fvm"
          chmod +x "$RUNNER_TEMP/shim/fvm"
          echo "$RUNNER_TEMP/shim" >> "$GITHUB_PATH"
      - name: Install firebase-tools
        # Major pinned to match deploy.yml (firebase-tools@13).
        run: npm install -g firebase-tools@13
      - name: Create dedicated iOS simulator
        # The Makefile defaults DEVICE to "Convyve E2E". Create it from the
        # newest installed iOS runtime and an iPhone device type that runtime
        # supports, discovered dynamically so this doesn't break when the
        # runner image rolls its Xcode/runtime versions (hard-coded
        # runtime/device-type ids would).
        run: |
          sel=$(xcrun simctl list -j runtimes available | python3 -c '
          import json, re, sys
          def iphones(rt):
              return [d for d in rt.get("supportedDeviceTypes", []) if d["name"].startswith("iPhone")]
          rts = [r for r in json.load(sys.stdin)["runtimes"]
                 if r.get("isAvailable")
                 and r["identifier"].startswith("com.apple.CoreSimulator.SimRuntime.iOS-")
                 and iphones(r)]
          if not rts:
              sys.exit("error: no available iOS runtime with an iPhone device type (see: xcrun simctl list runtimes)")
          rts.sort(key=lambda r: [int(p) for p in r["version"].split(".")])
          rt = rts[-1]
          cands = iphones(rt)
          pro = [d for d in cands if d["name"].endswith(" Pro")]
          gen = lambda d: int((re.search(r"iPhone (\d+)", d["name"]) or [0, 0])[1])
          print(rt["identifier"], max(pro or cands, key=gen)["identifier"])
          ')
          read -r runtime devtype <<< "$sel"
          echo "runtime=$runtime devicetype=$devtype"
          xcrun simctl create "Convyve E2E" "$devtype" "$runtime"
          xcrun simctl list devices available | grep "Convyve E2E"
      - name: Run E2E suite (make e2e, bounded retry)
        # The suite occasionally hangs after the Xcode build (smoke_test.dart
        # launch). Each attempt gets a hard wall-clock cap; on failure OR hang
        # we clean up and retry once. Retries only happen on failure, and a
        # retried-then-green run emits a warning so flakes stay visible.
        # `OPENJDK_PREFIX=` stops the Makefile prepending a brew openjdk
        # (possibly <21) ahead of setup-java's Java 21 on PATH.
        shell: bash
        run: |
          max_attempts=2
          attempt_timeout=$((40 * 60))
          last_status=1
          mkdir -p e2e-logs
          for attempt in $(seq 1 "$max_attempts"); do
            echo "::group::E2E attempt $attempt/$max_attempts"
            # setsid so the whole tree (make, firebase, java, flutter,
            # xcodebuild) is one process group we can kill on a hang.
            perl -MPOSIX -e 'POSIX::setsid(); exec @ARGV' make e2e OPENJDK_PREFIX= &
            pid=$!
            (
              # Quiet when cancelled: the parent cancels us with a plain TERM,
              # which must NOT fall through to the warning/kill below. `set +e`
              # is explicit so errexit inheritance can't abort the escalation.
              set +e
              sleep "$attempt_timeout" & sp=$!
              trap 'kill "$sp" 2>/dev/null; exit 0' TERM
              wait "$sp" || exit 0
              echo "::warning::E2E attempt $attempt exceeded $((attempt_timeout / 60)) min — killing"
              kill -TERM -- "-$pid" 2>/dev/null
              sleep 10 & sp=$!
              wait "$sp"
              kill -KILL -- "-$pid" 2>/dev/null
            ) &
            watchdog=$!
            status=0
            wait "$pid" || status=$?
            # Cancel the watchdog (silently, see above), then hard-kill whatever
            # is left in the group (e.g. a JVM stuck in a shutdown hook after
            # TERM still holds the emulator ports and would fail the next attempt).
            kill "$watchdog" 2>/dev/null || true
            wait "$watchdog" 2>/dev/null || true
            kill -KILL -- "-$pid" 2>/dev/null || true
            echo "::endgroup::"
            if [ "$status" -eq 0 ]; then
              if [ "$attempt" -gt 1 ]; then
                echo "::warning::E2E passed only on attempt $attempt — flaky launch/hang; see e2e-logs artifact"
                echo "E2E_RETRIED=true" >> "$GITHUB_ENV"
              fi
              exit 0
            fi
            last_status=$status
            echo "::warning::E2E attempt $attempt failed (exit $status)"
            mkdir -p "e2e-logs/attempt-$attempt"
            cp ./*-debug.log "e2e-logs/attempt-$attempt/" 2>/dev/null || true
            echo "E2E_RETRIED=true" >> "$GITHUB_ENV"
            # Clean slate: stray emulators/xcodebuild and a possibly wedged
            # simulator (make boots it again). Patterns are anchored to this
            # job's processes.
            pkill -9 -f 'firebase.*emulators:exec' 2>/dev/null || true
            pkill -9 -f 'cloud-firestore-emulator' 2>/dev/null || true
            pkill -9 -f 'emulator/functionsEmulatorRuntime' 2>/dev/null || true
            pkill -9 -f 'xcodebuild' 2>/dev/null || true
            xcrun simctl shutdown all 2>/dev/null || true
            if [ "$attempt" -lt "$max_attempts" ]; then
              sleep 5
            fi
          done
          echo "::error::E2E failed after $max_attempts attempts (last exit $last_status)"
          exit "$last_status"
      - name: Upload emulator logs
        if: always() && (failure() || cancelled() || env.E2E_RETRIED == 'true')
        uses: actions/upload-artifact@v4
        with:
          name: e2e-emulator-logs
          path: |
            *-debug.log
            e2e-logs/
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # One stable check for branch protection: green when every job that had to run
  # passed. Skipped jobs (path filter, draft) are fine; failed or cancelled are
  # not. E2E is deliberately excluded (non-blocking, see above).
  # ---------------------------------------------------------------------------
  ci-ok:
    name: CI OK
    if: always()
    needs: [changes, analyze-test, build-android, build-ios, functions-build, rules-test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check required jobs
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::A required CI job finished as '$r'"; exit 1 ;;
            esac
          done
