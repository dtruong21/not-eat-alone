name: Release

# Publishes a GitHub Release when a v* tag is pushed (tags live only on main).
#
# The Firebase backend deploy is NOT here any more: it runs from ci.yml after
# the CI gate is green (see deploy-firebase.yml and docs/CICD.md).

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  github-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
