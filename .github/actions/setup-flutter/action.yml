name: Set up Flutter app
description: >-
  Seeds .env, installs the Flutter SDK pinned in .fvmrc (single source of
  truth - no second pin to drift), restores the pub cache, runs pub get and
  (optionally) build_runner. Run actions/checkout first.

inputs:
  codegen:
    description: Run build_runner (generated *.freezed.dart / *.g.dart files are git-ignored).
    default: 'true'

runs:
  using: composite
  steps:
    # `.env` is git-ignored but pubspec.yaml lists it as an asset, so analyze
    # (asset_does_not_exist) and builds fail without it.
    - name: Seed .env from example
      shell: bash
      run: cp .env.example .env

    - name: Read the Flutter version pinned in .fvmrc
      id: fvm
      shell: bash
      run: echo "version=$(python3 -c "import json; print(json.load(open('.fvmrc'))['flutter'])")" >> "$GITHUB_OUTPUT"

    - uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ steps.fvm.outputs.version }}
        channel: stable
        cache: true

    - name: Restore pub cache
      uses: actions/cache@v4
      with:
        path: ~/.pub-cache
        key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
        restore-keys: pub-${{ runner.os }}-

    - name: Install dependencies
      shell: bash
      run: flutter pub get

    - name: Code generation
      if: inputs.codegen == 'true'
      shell: bash
      run: dart run build_runner build --delete-conflicting-outputs
