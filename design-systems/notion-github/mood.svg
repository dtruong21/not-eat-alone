<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <rect width="800" height="400" fill="#ffffff"/>

  <!-- Title -->
  <text x="40" y="68" font-family="Inter, system-ui, sans-serif" font-size="32" font-weight="600" fill="#37352f">Notion + GitHub</text>
  <text x="40" y="100" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="400" fill="#787774">Calm document feel · data-dense surfaces</text>

  <!-- Surface palette swatches -->
  <g transform="translate(40, 130)">
    <rect width="80" height="80" rx="8" fill="#ffffff" stroke="#e9e9e7"/>
    <rect x="92" width="80" height="80" rx="8" fill="#f7f6f3"/>
    <rect x="184" width="80" height="80" rx="8" fill="#37352f"/>
    <rect x="276" width="80" height="80" rx="8" fill="#2383e2"/>
    <text x="40" y="100" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#787774">bg</text>
    <text x="132" y="100" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#787774">surface</text>
    <text x="224" y="100" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#787774">text</text>
    <text x="316" y="100" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#787774">accent</text>
  </g>

  <!-- Heatmap strip -->
  <g transform="translate(40, 260)">
    <text x="0" y="-8" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#37352f">Heatmap (GitHub canonical)</text>
    <rect x="0" y="0" width="22" height="22" rx="3" fill="#ebedf0"/>
    <rect x="26" y="0" width="22" height="22" rx="3" fill="#9be9a8"/>
    <rect x="52" y="0" width="22" height="22" rx="3" fill="#40c463"/>
    <rect x="78" y="0" width="22" height="22" rx="3" fill="#30a14e"/>
    <rect x="104" y="0" width="22" height="22" rx="3" fill="#216e39"/>
  </g>

  <!-- Property row preview -->
  <g transform="translate(440, 130)">
    <rect width="320" height="200" rx="8" fill="#ffffff" stroke="#e9e9e7"/>
    <text x="20" y="36" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="600" fill="#37352f">Morning run</text>
    <line x1="20" y1="58" x2="300" y2="58" stroke="#ededec"/>

    <text x="20" y="86" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#787774">Schedule</text>
    <text x="300" y="86" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-size="16" fill="#37352f">Daily</text>
    <line x1="20" y1="106" x2="300" y2="106" stroke="#ededec"/>

    <text x="20" y="134" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#787774">Streak</text>
    <text x="300" y="134" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="16" font-weight="500" fill="#37352f">23</text>
    <line x1="20" y1="154" x2="300" y2="154" stroke="#ededec"/>

    <text x="20" y="182" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#787774">Best</text>
    <text x="300" y="182" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="16" font-weight="500" fill="#37352f">41</text>
  </g>

  <!-- Footer -->
  <text x="40" y="380" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#9b9a97">Best for trackers · productivity · data-dense apps</text>
</svg>
